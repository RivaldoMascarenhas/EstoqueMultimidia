name: UniFAP CI / Security Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Typecheck, Lint, Security Scanning & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: estoque_multimidia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema & Migrations
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/estoque_multimidia_test

      - name: Dependency Security Audit
        run: npm audit --audit-level=high --omit=dev

      - name: ESLint Code Quality Check
        run: npm run lint

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Automated Test Suite
        run: npx vitest run
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/estoque_multimidia_test
          NEXTAUTH_SECRET: ci_test_only_secret_key_not_for_production_use
          BIOMETRIC_INTERNAL_TOKEN: ci_test_only_biometric_token_not_for_production

      - name: Next.js Production Build Verification
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/estoque_multimidia_test
          NEXTAUTH_SECRET: ci_test_only_secret_key_not_for_production_use
          BIOMETRIC_INTERNAL_TOKEN: ci_test_only_biometric_token_not_for_production
