version: "3.8"

networks:
  unifap-network:
    driver: bridge

volumes:
  pgdata:
    driver: local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unifap-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina a variavel POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-estoque_multimidia}
    # Portas vinculadas estritamente a 127.0.0.1 (Loopback) para blindagem de rede
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - unifap-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-estoque_multimidia}"]
      interval: 5s
      timeout: 5s
      retries: 5

  biometric-api:
    build:
      context: ./biometric-api
      dockerfile: Dockerfile
    container_name: unifap-biometric-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-estoque_multimidia}
      BIOMETRIC_INTERNAL_TOKEN: ${BIOMETRIC_INTERNAL_TOKEN:?Defina a variavel BIOMETRIC_INTERNAL_TOKEN no .env}
      FACE_DISTANCE_THRESHOLD: ${FACE_DISTANCE_THRESHOLD:-0.60}
      MIN_CONFIDENCE_THRESHOLD: ${MIN_CONFIDENCE_THRESHOLD:-0.80}
      TZ: "America/Fortaleza"
      PORT: 8000
    # Comunicação interna via Docker Network; porta no host restrita a 127.0.0.1
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - unifap-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  init-db:
    image: node:20-slim
    container_name: unifap-init-db
    working_dir: /app
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-estoque_multimidia}
    # Instala o prisma client temporariamente e roda a migração de banco
    command: >
      sh -c "npm install prisma @prisma/client &&
             npx prisma migrate deploy"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unifap-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unifap-web-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-estoque_multimidia}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-${NEXTAUTH_URL:-http://localhost:3000}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Defina a variavel NEXTAUTH_SECRET no .env}
      BIOMETRIC_API_URL: http://biometric-api:8000
      BIOMETRIC_INTERNAL_TOKEN: ${BIOMETRIC_INTERNAL_TOKEN:?Defina a variavel BIOMETRIC_INTERNAL_TOKEN no .env}
      TZ: "America/Fortaleza"
    # Porta restrita a 127.0.0.1 para que o tráfego externo passe exclusivamente pelo Cloudflare Tunnel
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      biometric-api:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    networks:
      - unifap-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2024.8.3
    container_name: unifap-cloudflared
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Defina a variavel CLOUDFLARE_TUNNEL_TOKEN no .env}
    depends_on:
      - app
    networks:
      - unifap-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
