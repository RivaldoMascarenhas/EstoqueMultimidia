networks:
  unifap-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unifap-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina a variavel POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-estoque_multimidia}
    # PostgreSQL isolado na rede interna Docker unifap-network (sem exposição externa de portas)
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - unifap-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-estoque_multimidia}"]
      interval: 5s
      timeout: 5s
      retries: 5

  biometric-api:
    build:
      context: ./biometric-api
      dockerfile: Dockerfile
    container_name: unifap-biometric-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-estoque_multimidia}
      BIOMETRIC_INTERNAL_TOKEN: ${BIOMETRIC_INTERNAL_TOKEN:?Defina a variavel BIOMETRIC_INTERNAL_TOKEN no .env}
      FACE_DISTANCE_THRESHOLD: ${FACE_DISTANCE_THRESHOLD:-0.60}
      MIN_CONFIDENCE_THRESHOLD: ${MIN_CONFIDENCE_THRESHOLD:-0.80}
      TZ: "America/Fortaleza"
    # Biometric API isolada na rede interna Docker unifap-network (sem exposição externa de portas)
    networks:
      - unifap-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  init-db:
    image: node:20-slim
    container_name: unifap-init-db
    working_dir: /app
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina a variavel POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-estoque_multimidia}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-estoque_multimidia}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-}
      SEED_MOCK_DATA: ${SEED_MOCK_DATA:-false}
      NODE_ENV: production
    # Inicializa extensão pgvector, executa migrações controladas do Prisma e executa seed idempotente seguro
    command: >
      sh -c "apt-get update -y && apt-get install -y openssl ca-certificates postgresql-client &&
             PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h postgres -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'CREATE EXTENSION IF NOT EXISTS vector;' &&
             npm install prisma@5.18.0 @prisma/client@5.18.0 tsx@4.17.0 bcryptjs @types/bcryptjs &&
             npx prisma migrate deploy &&
             npx tsx prisma/seed.ts"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unifap-network

  redis:
    image: redis:7-alpine
    container_name: unifap-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-unifapredissecurepassword}"]
    volumes:
      - redisdata:/data
    networks:
      - unifap-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-unifapredissecurepassword}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unifap-web-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-estoque_multimidia}
      REDIS_URL: ${REDIS_URL:-redis://:unifapredissecurepassword@redis:6379}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-${NEXTAUTH_URL:-http://localhost:3000}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Defina a variavel NEXTAUTH_SECRET no .env}
      BIOMETRIC_API_URL: http://biometric-api:8000
      BIOMETRIC_INTERNAL_TOKEN: ${BIOMETRIC_INTERNAL_TOKEN:?Defina a variavel BIOMETRIC_INTERNAL_TOKEN no .env}
      TZ: "America/Fortaleza"
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      biometric-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    networks:
      - unifap-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

